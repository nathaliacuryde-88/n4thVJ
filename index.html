<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Interactive VJ Experiment Page</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
      }
      #root {
        height: 100%;
      }
    </style>
    <style>
      /* The last resort, hidden until the watchdog below gives up. */
      #vj-stuck {
        display: none;
        position: fixed;
        inset: 0;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        background: #000;
        color: #fff;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: center;
      }
      #vj-stuck b { font-size: 22px; letter-spacing: -0.02em; }
      #vj-stuck p { margin: 0; max-width: 34em; color: rgba(255, 255, 255, 0.55); }
      #vj-why {
        display: none;
        max-width: 44em;
        max-height: 34vh;
        overflow: auto;
        margin: 0;
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        color: #ff9f9f;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #vj-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 4px;
      }
      #vj-stuck button {
        padding: 10px 22px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font: inherit;
        font-weight: 600;
        letter-spacing: 0.14em;
        cursor: pointer;
      }
      #vj-copy { display: none; }
      #vj-stuck button.ghost {
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
        font-weight: 400;
      }
    </style>
    <script>
      /*
       * Recover from a stale cached page.
       *
       * Every build gives the bundle a new hashed name and a deploy replaces the
       * old one, so a browser holding this file from a previous deploy asks for
       * a script that is no longer there. Nothing then runs: the page is blank,
       * with no error on screen and nothing to click.
       *
       * A failed script or stylesheet fires an error that does not bubble, hence
       * the capture. Two things matter in the retry:
       *
       * The guard is a cooldown, not a latch. It used to be a flag that lasted
       * the whole tab, so once a retry had been spent the recovery never armed
       * again — and every later refresh in that tab went straight back to a
       * blank page with nothing trying to fix it. A timestamp lets a reload a
       * minute later have another go while still refusing to loop.
       *
       * And the reload carries a cache-buster. A plain reload() is supposed to
       * revalidate the document, but the whole problem is a cache serving a
       * stale copy, so this does not rely on that.
       */
      (function () {
        var KEY = 'vj-stale-bundle-reload';
        var COOLDOWN = 15000;

        /*
         * Keep the first thing that went wrong, so the notice can show it.
         *
         * A blank page that only reproduces on someone else's machine is
         * unfixable without the message, and asking a person mid-soundcheck to
         * open DevTools is not a plan. This listener is registered before the
         * module script, so nothing thrown on the way up is missed.
         */
        var firstError = null;
        function keep(what, err) {
          if (firstError) return;
          var text = '';
          try {
            if (err && err.stack) text = String(err.stack);
            else if (err && err.message) text = err.name + ': ' + err.message;
            else text = String(err);
          } catch (_) {
            text = '(unreadable)';
          }
          firstError = what + '\n' + text;
        }

        function lastTry() {
          try {
            return parseInt(sessionStorage.getItem(KEY) || '0', 10) || 0;
          } catch (_) {
            return 0;
          }
        }

        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;

            // A file that never arrived: note it, then try the reload above.
            if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
              keep('Failed to load', (el.src || el.href || el.tagName) + '');
              if (Date.now() - lastTry() < COOLDOWN) return;
              try {
                sessionStorage.setItem(KEY, String(Date.now()));
              } catch (_) {
                return; // no storage means no loop guard, so do not risk the loop
              }
              location.replace(location.pathname + '?v=' + Date.now());
              return;
            }

            // A file that arrived and threw: only worth reporting.
            keep(
              'Error' +
                (event.filename
                  ? ' at ' + event.filename + ':' + event.lineno
                  : ''),
              event.error || event.message,
            );
          },
          true,
        );

        window.addEventListener('unhandledrejection', function (event) {
          keep('Unhandled rejection', event.reason);
        });

        /*
         * Whatever else happens, never just sit there black.
         *
         * The reload above only fires when a file fails to load. A bundle that
         * loads and then throws on the way up leaves the same empty screen with
         * no explanation, so this waits for React to put something in #root and
         * otherwise says so, with a button that bypasses the cache.
         */
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.childElementCount > 0) return;
            var stuck = document.getElementById('vj-stuck');
            if (stuck) stuck.style.display = 'grid';

            /*
             * Six seconds is a guess, and a slow machine parsing a megabyte of
             * three.js can beat it. If React turns up late, get out of its way
             * rather than leaving her reading a failure notice over a working
             * app.
             */
            if (root && !firstError) {
              new MutationObserver(function (_, self) {
                if (root.childElementCount === 0) return;
                if (stuck) stuck.style.display = 'none';
                self.disconnect();
              }).observe(root, { childList: true });
            }

            if (!firstError) return;

            var why = document.getElementById('vj-why');
            if (why) {
              why.textContent = firstError;
              why.style.display = 'block';
            }
            var copy = document.getElementById('vj-copy');
            if (copy) copy.style.display = 'inline-block';

            /*
             * Knowing the error changes the advice. Blaming the cache is only
             * a fair guess while nothing else is known.
             */
            var blurb = document.getElementById('vj-blurb');
            if (blurb) {
              blurb.textContent =
                'It tripped over this on the way up. RESET EVERYTHING throws away ' +
                'the saved set, settings and clips, which is usually what fixes it.';
            }
          }, 6000);
        });

        /*
         * The last resort's last resort: throw away everything the app has
         * saved. A crash that only happens on one machine is usually something
         * in storage that the code cannot read back, and this is the one fix
         * for it that does not need a console.
         */
        window.vjCopy = function (button) {
          try {
            navigator.clipboard.writeText(firstError || '');
            button.textContent = 'COPIED';
          } catch (_) {
            var range = document.createRange();
            range.selectNodeContents(document.getElementById('vj-why'));
            var sel = getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            button.textContent = 'SELECTED — PRESS COPY';
          }
        };

        window.vjWipe = function () {
          try { localStorage.clear(); } catch (_) {}
          try { sessionStorage.clear(); } catch (_) {}
          try {
            if (indexedDB.databases) {
              indexedDB.databases().then(function (dbs) {
                dbs.forEach(function (db) {
                  if (db.name) indexedDB.deleteDatabase(db.name);
                });
                setTimeout(go, 400);
              });
              return;
            }
            indexedDB.deleteDatabase('n4thvj');
          } catch (_) {}
          go();
          function go() {
            location.replace(location.pathname + '?v=' + Date.now());
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <div id="vj-stuck">
      <b>&lt;N4TH&gt;</b>
      <p id="vj-blurb">
        This did not start. Usually that is an old copy of the page held in the
        browser cache after an update — reloading past it fixes it.
      </p>
      <pre id="vj-why"></pre>
      <div id="vj-actions">
        <button id="vj-copy" class="ghost" onclick="vjCopy(this)">
          COPY THE ERROR
        </button>
        <button onclick="location.replace(location.pathname + '?v=' + Date.now())">
          RELOAD
        </button>
        <button class="ghost" onclick="vjWipe()">RESET EVERYTHING</button>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
